name: Release Manager

on:
  workflow_call:
    inputs:
      validation-run-id:
        required: true
        type: string
      verified-sha:
        required: true
        type: string
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true
  repository_dispatch:
    types: [release-request]

permissions:
  actions: read
  contents: read

concurrency:
  group: release-manager
  cancel-in-progress: false

jobs:
  manage:
    name: Reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: write
      - name: App identity
        id: app
        env:
          CONFIGURED_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_APP_SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]] || {
            echo 'The token returned an invalid GitHub App slug' >&2
            exit 1
          }
          login="${RELEASE_APP_SLUG}[bot]"
          [[ "$CONFIGURED_LOGIN" == "$login" ]] || {
            echo 'RELEASE_APP_LOGIN does not match the GitHub App installation token' >&2
            exit 1
          }
          bot_id="$(gh api "users/$login" --jq '.id')"
          [[ "$bot_id" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Unable to resolve the GitHub App bot identity' >&2
            exit 1
          }
          {
            echo "email=$bot_id+$login@users.noreply.github.com"
            echo "login=$login"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: git-cliff
        run: bash scripts/install-git-cliff.sh
      - name: Release state
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_EMAIL: ${{ steps.app.outputs.email }}
          RELEASE_APP_LOGIN: ${{ steps.app.outputs.login }}
          REQUESTED_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.version || '' }}
          VALIDATION_RUN_ID: ${{ inputs.validation-run-id || '' }}
          VERIFIED_SHA: ${{ inputs.verified-sha || '' }}
        run: bash scripts/manage-release.sh
