name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing managed release tag to recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  metadata:
    name: Context
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      control-sha: ${{ steps.resolve.outputs.control-sha }}
      dockerhub-image: ${{ steps.registries.outputs.dockerhub }}
      ghcr-image: ${{ steps.registries.outputs.ghcr }}
      primary-image: ${{ steps.registries.outputs.primary }}
      sha: ${{ steps.resolve.outputs.sha }}
      signing-identity: ${{ steps.resolve.outputs.signing-identity }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Version and trusted workflow identity
        id: resolve
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Release tag must be canonical stable SemVer: $tag" >&2
            exit 1
          }
          identity="https://github.com/$WORKFLOW_REF"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$TRIGGER_REF" == refs/heads/main ]] || {
              echo "Release recovery must use the workflow on main" >&2
              exit 1
            }
            git merge-base --is-ancestor "$WORKFLOW_SHA" origin/main || {
              echo "Release recovery workflow is not trusted by main" >&2
              exit 1
            }
            expected_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-release.yml@refs/heads/main"
          else
            [[ "$GITHUB_REF_TYPE" == tag && "$TRIGGER_REF" == "refs/tags/$tag" ]] || {
              echo "Automatic publication must be triggered by the managed tag" >&2
              exit 1
            }
            expected_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-release.yml@refs/tags/$tag"
          fi
          [[ "$identity" == "$expected_identity" ]] || {
            echo "Release workflow identity does not match its trusted trigger" >&2
            exit 1
          }
          package_id="$(cargo pkgid --locked -p camellia-nexus-management-server)"
          version="${package_id##*@}"
          [[ "v$version" == "$tag" ]] || {
            echo "Release tag $tag does not match committed server version $version" >&2
            exit 1
          }
          sha="$(git rev-list -n 1 "refs/tags/$tag")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$sha" ]] || {
            echo "Release checkout does not match the tag target" >&2
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch && "$TRIGGER_SHA" != "$sha" ]]; then
            echo "Release event SHA does not match the tag target" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "Release tag $tag is not on main" >&2
            exit 1
          }
          {
            echo "control-sha=$WORKFLOW_SHA"
            echo "sha=$sha"
            echo "signing-identity=$identity"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Trusted registry resolver
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$GITHUB_WORKFLOW_SHA^{commit}"
          git show "$GITHUB_WORKFLOW_SHA:scripts/resolve-container-registries.sh" \
            > "$RUNNER_TEMP/resolve-container-registries.sh"
          chmod 700 "$RUNNER_TEMP/resolve-container-registries.sh"
      - name: Reviewed registry targets
        id: registries
        env:
          CONTAINER_REGISTRY_MAP: ${{ vars.CONTAINER_REGISTRY_MAP }}
          LOGICAL_REPOSITORY_ID: nexus-management
        run: bash "$RUNNER_TEMP/resolve-container-registries.sh"
      - name: Summary
        env:
          DOCKERHUB_IMAGE: ${{ steps.registries.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.registries.outputs.ghcr }}
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
          VERSION: ${{ steps.resolve.outputs.version }}
        shell: bash
        run: |
          {
            echo "## Release candidate"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Commit: \`$RELEASE_SHA\`"
            if [[ -n "$GHCR_IMAGE" ]]; then
              echo "- GHCR: \`$GHCR_IMAGE\`"
            else
              echo "- GHCR: skipped (not configured)"
            fi
            if [[ -n "$DOCKERHUB_IMAGE" ]]; then
              echo "- Docker Hub: \`$DOCKERHUB_IMAGE\`"
            else
              echo "- Docker Hub: skipped (not configured)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  authorize:
    name: Authorize
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # Bind authorization to the exact successful validation run.
      contents: read
      pull-requests: read # Revalidate the managed Release PR and exact head.
    outputs:
      release-digest: ${{ steps.release.outputs.release-digest }}
      release-draft: ${{ steps.release.outputs.release-draft }}
      release-id: ${{ steps.release.outputs.release-id }}
      release-pr-number: ${{ steps.release.outputs.release-pr-number }}
      validation-run-id: ${{ steps.release.outputs.validation-run-id }}
    steps:
      - name: Policy token
        id: policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.tag }}
      - name: Trusted release control
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$GITHUB_WORKFLOW_SHA^{commit}"
          git show "$GITHUB_WORKFLOW_SHA:scripts/manage-release.sh" \
            > "$RUNNER_TEMP/manage-release.sh"
          chmod 700 "$RUNNER_TEMP/manage-release.sh"
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Managed release
        id: release
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.policy-token.outputs.app-slug }}
          RELEASE_POLICY_TOKEN: ${{ steps.policy-token.outputs.token }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: bash "$RUNNER_TEMP/manage-release.sh" validate-publish

  evidence:
    name: Freeze candidate
    if: ${{ needs.authorize.outputs.release-draft == 'true' }}
    needs: [metadata, authorize]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read # Read only the exact CI evidence and dependency Release assets.
      attestations: write # Record SBOM and provenance for the frozen image digest.
      contents: read
      id-token: write # Mint the short-lived identity used by GitHub attestations.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.tag }}
      - name: Trusted evidence control
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$GITHUB_WORKFLOW_SHA^{commit}"
          for script in \
            build_image_release_evidence.py \
            resolve_nexus_client_release.py \
            validate-release-evidence.py
          do
            git show "$GITHUB_WORKFLOW_SHA:scripts/$script" > "$RUNNER_TEMP/$script"
            chmod 700 "$RUNNER_TEMP/$script"
          done
      - name: Resolve exact completed client dependency
        id: client
        env:
          GH_TOKEN: ${{ github.token }}
          NEXUS_REPOSITORY_MAP: ${{ vars.NEXUS_REPOSITORY_MAP }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          PYTHONPATH="$RUNNER_TEMP" python3 "$RUNNER_TEMP/resolve_nexus_client_release.py" \
            --repository-map "$NEXUS_REPOSITORY_MAP" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --current-repository "$GITHUB_REPOSITORY" \
            --release-app-login "$RELEASE_APP_LOGIN" \
            --output-directory release-assets \
            --github-output "$GITHUB_OUTPUT"
      - name: Checkout exact client dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.client.outputs.repository }}
          ref: ${{ steps.client.outputs.commit }}
          path: _nexus_client
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Exact client/service compatibility
        run: |
          node scripts/check-cross-repo-contract.mjs _nexus_client
          node scripts/test-cross-repo-contract.mjs _nexus_client
      - name: Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build immutable OCI layout
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/release-image.oci.tar
          tags: nexus-management-service:v${{ needs.metadata.outputs.version }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            REVISION=${{ needs.metadata.outputs.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Resolve OCI platform digest
        id: image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir "$RUNNER_TEMP/release-image-layout"
          tar -xf "$RUNNER_TEMP/release-image.oci.tar" \
            -C "$RUNNER_TEMP/release-image-layout"
          index="$RUNNER_TEMP/release-image-layout/index.json"
          test "$(jq '[.manifests[].digest] | unique | length' "$index")" = 1
          test "$(jq -r '.manifests[0].digest' "$index")" = "$IMAGE_DIGEST"
          manifest="$RUNNER_TEMP/release-image-layout/blobs/sha256/${IMAGE_DIGEST#sha256:}"
          platform_digest="$(
            jq -er '
              [
                .manifests[] |
                select(.platform.os == "linux" and .platform.architecture == "amd64") |
                .digest
              ] |
              if length == 1 then .[0] else error("expected one linux/amd64 manifest") end
            ' "$manifest"
          )"
          [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "platform-digest=$platform_digest" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg digest "$IMAGE_DIGEST" \
            --arg platform_digest "$platform_digest" \
            --arg commit "$RELEASE_SHA" \
            --arg version "$VERSION" '{
              schema_version: 1,
              image: "nexus-management-service",
              version: $version,
              source_commit: $commit,
              digest: $digest,
              platforms: [{
                platform: "linux",
                architecture: "amd64",
                digest: $platform_digest
              }]
            }' > release-assets/release-image-metadata.json
      - name: Vulnerability scan of frozen OCI bytes
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/release-image-layout
          version: v0.72.0
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: release-assets/VULNERABILITY-SCAN.json
          exit-code: "1"
          timeout: 10m0s
      - name: SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: oci-archive:${{ runner.temp }}/release-image.oci.tar
          format: spdx-json
          output-file: release-assets/SBOM.spdx.json
          syft-version: v1.50.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Provenance attestation
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ needs.metadata.outputs.primary-image }}
          subject-digest: ${{ steps.build.outputs.digest }}
      - name: SBOM attestation
        id: sbom-attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ needs.metadata.outputs.primary-image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: release-assets/SBOM.spdx.json
      - name: Freeze candidate evidence
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM_DIGEST: ${{ steps.image.outputs.platform-digest }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          SBOM_ATTESTATION_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
          VALIDATION_RUN_ID: ${{ needs.authorize.outputs.validation-run-id }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cp -- "$PROVENANCE_BUNDLE" release-assets/PROVENANCE.intoto.jsonl
          cp -- "$SBOM_ATTESTATION_BUNDLE" \
            release-assets/SBOM-ATTESTATION.intoto.jsonl
          PYTHONPATH="$RUNNER_TEMP" python3 "$RUNNER_TEMP/build_image_release_evidence.py" freeze \
            --version "$VERSION" \
            --commit "$RELEASE_SHA" \
            --validation-run-id "$VALIDATION_RUN_ID" \
            --digest "$IMAGE_DIGEST" \
            --platform "linux/amd64=$PLATFORM_DIGEST" \
            --sbom release-assets/SBOM.spdx.json \
            --provenance release-assets/PROVENANCE.intoto.jsonl \
            --dependencies release-assets/dependencies.json \
            --output release-assets/frozen-release-evidence.json
          mkdir frozen-input
          mv release-assets frozen-input/
          mv "$RUNNER_TEMP/release-image.oci.tar" frozen-input/
      - name: Upload frozen candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-management-${{ needs.metadata.outputs.version }}-frozen
          path: frozen-input
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.authorize.result == 'success' &&
      (
        needs.authorize.outputs.release-draft == 'false' ||
        needs.evidence.result == 'success'
      )
    needs: [metadata, authorize, evidence]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 60
    permissions:
      actions: read # Download only the exact frozen release candidate.
      attestations: read # Verify the frozen SBOM and provenance before publication.
      contents: read
      id-token: write # Mint the short-lived keyless Cosign publication identity.
      packages: write # Publish configured GHCR aliases for the verified digest.
      pull-requests: write # Remove the completion label only after immutable readback succeeds.
    steps:
      - name: Policy token
        id: policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.tag }}
      - name: Trusted publication control
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$GITHUB_WORKFLOW_SHA^{commit}"
          for script in \
            build_image_release_evidence.py \
            manage-release.sh \
            publish_image_release.sh \
            reconcile_image_latest.sh \
            test-container-runtime.sh \
            validate-release-evidence.py
          do
            git show "$GITHUB_WORKFLOW_SHA:scripts/$script" > "$RUNNER_TEMP/$script"
            chmod 700 "$RUNNER_TEMP/$script"
          done
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Reauthorize
        id: reauthorize
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.policy-token.outputs.app-slug }}
          RELEASE_POLICY_TOKEN: ${{ steps.policy-token.outputs.token }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: bash "$RUNNER_TEMP/manage-release.sh" validate-publish
      - name: Download frozen candidate
        if: ${{ needs.authorize.outputs.release-draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexus-management-${{ needs.metadata.outputs.version }}-frozen
          path: frozen-input
      - name: ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3
      - name: Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Validate Docker Hub credentials
        if: ${{ needs.metadata.outputs.dockerhub-image != '' }}
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]] || {
            echo "Docker Hub is configured by policy but its credential pair is missing" >&2
            exit 1
          }
      - name: GHCR login
        if: ${{ needs.metadata.outputs.ghcr-image != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Docker Hub login
        if: ${{ needs.metadata.outputs.dockerhub-image != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish or verify exact release
        env:
          ASSETS_DIRECTORY: frozen-input/release-assets
          DOCKERHUB_IMAGE: ${{ needs.metadata.outputs.dockerhub-image }}
          GHCR_IMAGE: ${{ needs.metadata.outputs.ghcr-image }}
          GH_TOKEN: ${{ github.token }}
          OCI_ARCHIVE: frozen-input/release-image.oci.tar
          PRIMARY_IMAGE: ${{ needs.metadata.outputs.primary-image }}
          RECORDED_DIGEST: ${{ steps.reauthorize.outputs.release-digest }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.policy-token.outputs.app-slug }}
          RELEASE_ID: ${{ steps.reauthorize.outputs.release-id }}
          RELEASE_POLICY_TOKEN: ${{ steps.policy-token.outputs.token }}
          RELEASE_PR_NUMBER: ${{ steps.reauthorize.outputs.release-pr-number }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          RELEASE_SIGNING_IDENTITY: ${{ needs.metadata.outputs.signing-identity }}
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          VERIFY_PUBLISHED_ONLY: ${{ needs.authorize.outputs.release-draft == 'false' }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: bash "$RUNNER_TEMP/publish_image_release.sh"
      - name: Publication proof
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.policy-token.outputs.app-slug }}
          RELEASE_POLICY_TOKEN: ${{ steps.policy-token.outputs.token }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: bash "$RUNNER_TEMP/manage-release.sh" complete-publish
      - name: Reconcile highest completed stable release
        id: latest
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.policy-token.outputs.app-slug }}
          RELEASE_POLICY_TOKEN: ${{ steps.policy-token.outputs.token }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: bash "$RUNNER_TEMP/manage-release.sh" reconcile-latest
      - name: Reconcile registry latest aliases
        env:
          DOCKERHUB_IMAGE: ${{ needs.metadata.outputs.dockerhub-image }}
          GHCR_IMAGE: ${{ needs.metadata.outputs.ghcr-image }}
          LATEST_DIGEST: ${{ steps.latest.outputs.latest-digest }}
          OWNS_LATEST: ${{ steps.latest.outputs.owns-latest }}
        run: bash "$RUNNER_TEMP/reconcile_image_latest.sh"
