name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing managed release tag to recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  metadata:
    name: Context
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      sha: ${{ steps.resolve.outputs.sha }}
      signing-identity: ${{ steps.resolve.outputs.signing-identity }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Version
        id: resolve
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Release tag must be canonical stable SemVer: $tag" >&2
            exit 1
          }
          identity="https://github.com/$WORKFLOW_REF"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$TRIGGER_REF" == refs/heads/main ]] || {
              echo 'Release recovery must use the workflow on main' >&2
              exit 1
            }
            git merge-base --is-ancestor "$WORKFLOW_SHA" origin/main || {
              echo 'Release recovery workflow is not trusted by main' >&2
              exit 1
            }
            expected_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-release.yml@refs/heads/main"
          else
            [[ "$GITHUB_REF_TYPE" == tag && "$TRIGGER_REF" == "refs/tags/$tag" ]] || {
              echo 'Automatic publication must be triggered by the managed tag' >&2
              exit 1
            }
            expected_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-release.yml@refs/tags/$tag"
          fi
          [[ "$identity" == "$expected_identity" ]] || {
            echo 'Release workflow identity does not match its trusted trigger' >&2
            exit 1
          }
          package_id="$(cargo pkgid --locked -p camellia-nexus-management-server)"
          version="${package_id##*@}"
          [[ "v$version" == "$tag" ]] || {
            echo "Release tag $tag does not match committed server version $version" >&2
            exit 1
          }
          sha="$(git rev-list -n 1 "refs/tags/$tag")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$sha" ]] || {
            echo 'Release checkout does not match the tag target' >&2
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch && "$TRIGGER_SHA" != "$sha" ]]; then
            echo 'Release event SHA does not match the tag target' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "Release tag $tag is not on main" >&2
            exit 1
          }
          owner="$(tr '[:upper:]' '[:lower:]' <<< "$GITHUB_REPOSITORY_OWNER")"
          image="ghcr.io/$owner/nexus-management-server"
          {
            echo "image=$image"
            echo "sha=$sha"
            echo "signing-identity=$identity"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Release'
            echo "- Version: \`$version\`"
            echo "- Image: \`$image\`"
            echo "- Commit: \`$sha\`"
            echo "- Control: \`$WORKFLOW_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  authorize:
    name: Authorize
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # Revalidate the exact CI evidence authorized by the release PR.
      contents: read
      pull-requests: read # Bind the tag to immutable merged release PR metadata.
    steps:
      - name: Policy token
        id: policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.tag }}
      - name: Control
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$GITHUB_WORKFLOW_SHA^{commit}"
          git show "$GITHUB_WORKFLOW_SHA:scripts/manage-release.sh" > "$RUNNER_TEMP/manage-release.sh"
          chmod 700 "$RUNNER_TEMP/manage-release.sh"
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Managed release
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.policy-token.outputs.app-slug }}
          RELEASE_POLICY_TOKEN: ${{ steps.policy-token.outputs.token }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: bash "$RUNNER_TEMP/manage-release.sh" validate-publish

  publish:
    name: Publish
    needs: [metadata, authorize]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 45
    permissions:
      actions: read # Download only the candidate artifacts produced for this release.
      contents: read
      id-token: write # Obtain short-lived Sigstore identities for image and release evidence.
      packages: write # Publish the authorized image to the repository package namespace.
      pull-requests: write # Remove the release-pending label after public readback succeeds.
    env:
      RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
      RELEASE_SIGNING_IDENTITY: ${{ needs.metadata.outputs.signing-identity }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - name: Policy token
        id: policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.tag }}
      - name: Control
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$GITHUB_WORKFLOW_SHA^{commit}"
          git show "$GITHUB_WORKFLOW_SHA:scripts/manage-release.sh" > "$RUNNER_TEMP/manage-release.sh"
          chmod 700 "$RUNNER_TEMP/manage-release.sh"
      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Reauthorize registry
        id: registry-release
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.policy-token.outputs.app-slug }}
          RELEASE_POLICY_TOKEN: ${{ steps.policy-token.outputs.token }}
        run: bash "$RUNNER_TEMP/manage-release.sh" validate-publish

      - name: Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Existing aliases
        id: existing
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          RECORDED_DIGEST: ${{ steps.registry-release.outputs.release-digest }}
          RELEASE_DRAFT: ${{ steps.registry-release.outputs.release-draft }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_DRAFT" == true || "$RELEASE_DRAFT" == false ]] || {
            echo "Invalid managed Release state: $RELEASE_DRAFT" >&2
            exit 1
          }
          [[ -z "$RECORDED_DIGEST" || "$RECORDED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'Managed Release contains an invalid container digest' >&2
            exit 1
          }
          if [[ "$RELEASE_DRAFT" == true && -n "$RECORDED_DIGEST" ]]; then
            echo 'Draft Release cannot claim a published container digest' >&2
            exit 1
          fi
          if [[ "$RELEASE_DRAFT" == false && -z "$RECORDED_DIGEST" ]]; then
            echo 'Published Release has no recorded container digest' >&2
            exit 1
          fi
          digest_for() {
            local digest output
            if ! output="$(docker buildx imagetools inspect "$1" 2>&1)"; then
              if grep -Eqi 'manifest unknown|no such manifest|not found' <<< "$output"; then
                return 0
              fi
              echo "Unable to query immutable alias $1: $output" >&2
              return 1
            fi
            digest="$(awk '/^Digest:/ { print $2; exit }' <<< "$output")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Registry returned no canonical digest for $1" >&2
              return 1
            }
            printf '%s\n' "$digest"
          }
          digest=""
          for tag in "$VERSION" "sha-$RELEASE_SHA"; do
            candidate="$(digest_for "$IMAGE:$tag")"
            if [[ -n "$candidate" ]]; then
              if [[ -n "$digest" && "$candidate" != "$digest" ]]; then
                echo "Immutable image aliases resolve to different digests" >&2
                exit 1
              fi
              digest="$candidate"
            fi
          done
          if [[ -n "$RECORDED_DIGEST" ]]; then
            recorded="$(digest_for "$IMAGE@$RECORDED_DIGEST")"
            [[ "$recorded" == "$RECORDED_DIGEST" ]] || {
              echo "Recorded container digest is unavailable: $IMAGE@$RECORDED_DIGEST" >&2
              exit 1
            }
            [[ -z "$digest" || "$digest" == "$RECORDED_DIGEST" ]] || {
              echo 'Immutable image aliases do not match the published Release digest' >&2
              exit 1
            }
            digest="$RECORDED_DIGEST"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Reuse signature
        if: ${{ steps.existing.outputs.digest != '' }}
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          IMAGE: ${{ needs.metadata.outputs.image }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-release.yml@refs/tags/$RELEASE_TAG"
          identities=("$tag_identity")
          [[ "$RELEASE_SIGNING_IDENTITY" == "$tag_identity" ]] || identities+=("$RELEASE_SIGNING_IDENTITY")
          for identity in "${identities[@]}"; do
            if cosign verify "$IMAGE@$EXISTING_DIGEST" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" >/dev/null 2>&1; then
              echo "VERIFIED_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "Existing immutable alias digest is not signed by the managed tag or recovery workflow; refusing reuse or back-signing" >&2
          exit 1

      - name: Build image
        if: ${{ steps.existing.outputs.digest == '' }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=${{ needs.metadata.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            REVISION=${{ needs.metadata.outputs.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Digest
        id: digest
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          IMAGE: ${{ needs.metadata.outputs.image }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-${BUILT_DIGEST:-}}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Unable to resolve release image digest" >&2; exit 1; }
          echo "RELEASE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Image identity
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$RELEASE_DIGEST"
          test "$(docker run --rm "$IMAGE@$RELEASE_DIGEST" --version)" = "camellia-nexus-management-server $VERSION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE@$RELEASE_DIGEST")" = "$VERSION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE@$RELEASE_DIGEST")" = "$RELEASE_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$IMAGE@$RELEASE_DIGEST")" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          bash scripts/test-container-runtime.sh "$IMAGE@$RELEASE_DIGEST"

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.metadata.outputs.image }}@${{ steps.digest.outputs.digest }}
          version: v0.72.0
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          timeout: 10m0s

      - name: Sign
        if: ${{ steps.existing.outputs.digest == '' }}
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$RELEASE_DIGEST"
          echo "VERIFIED_SIGNING_IDENTITY=$RELEASE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Immutable aliases
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          identity="$VERIFIED_SIGNING_IDENTITY"
          cosign verify "$IMAGE@$RELEASE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" >/dev/null
          digest_for() {
            local digest output
            if ! output="$(docker buildx imagetools inspect "$1" 2>&1)"; then
              if grep -Eqi 'manifest unknown|no such manifest|not found' <<< "$output"; then
                return 0
              fi
              echo "Unable to query immutable alias $1: $output" >&2
              return 1
            fi
            digest="$(awk '/^Digest:/ { print $2; exit }' <<< "$output")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Registry returned no canonical digest for $1" >&2
              return 1
            }
            printf '%s\n' "$digest"
          }
          for tag in "$VERSION" "sha-$RELEASE_SHA"; do
            current="$(digest_for "$IMAGE:$tag")"
            if [[ -z "$current" ]]; then
              docker buildx imagetools create --tag "$IMAGE:$tag" "$IMAGE@$RELEASE_DIGEST"
              current="$(digest_for "$IMAGE:$tag")"
            fi
            [[ "$current" == "$RELEASE_DIGEST" ]] || { echo "$IMAGE:$tag does not resolve to $RELEASE_DIGEST" >&2; exit 1; }
          done

      - name: Reauthorize release
        id: reauthorize
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.policy-token.outputs.app-slug }}
          RELEASE_POLICY_TOKEN: ${{ steps.policy-token.outputs.token }}
        run: bash "$RUNNER_TEMP/manage-release.sh" validate-publish

      - name: GitHub Release
        id: github-release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.metadata.outputs.image }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_ID: ${{ steps.reauthorize.outputs.release-id }}
          RELEASE_POLICY_TOKEN: ${{ steps.policy-token.outputs.token }}
          RELEASE_PR_NUMBER: ${{ steps.reauthorize.outputs.release-pr-number }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          read_release() {
            GH_TOKEN="$RELEASE_POLICY_TOKEN" gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -ce --arg tag "v$VERSION" --argjson id "$RELEASE_ID" '
                [.[][] | select(.tag_name == $tag)] as $matches |
                if ($matches | length) == 1 and $matches[0].id == $id then $matches[0]
                elif ($matches | length) == 0 then error("managed release not found")
                elif ($matches | length) > 1 then error("multiple releases use the same tag")
                else error("managed release identity changed") end
              '
          }
          release_json="$RUNNER_TEMP/release-before-publish.json"
          read_release > "$release_json"
          test "$(jq -r '.id // empty' "$release_json")" = "$RELEASE_ID"
          test "$(jq -r '.tag_name // empty' "$release_json")" = "v$VERSION"
          test "$(jq -r '.target_commitish // empty' "$release_json")" = "$RELEASE_SHA"
          test "$(jq -r '.author.login // empty' "$release_json")" = "$RELEASE_APP_LOGIN"
          body="$(jq -r '.body // ""' "$release_json")"
          test "$(grep -Fxc "<!-- release-commit:$RELEASE_SHA -->" <<< "$body" || true)" = 1
          test "$(grep -Fxc "<!-- release-pr:$RELEASE_PR_NUMBER -->" <<< "$body" || true)" = 1
          marker="<!-- container-digest:$RELEASE_DIGEST -->"
          existing_marker="$(grep -o '<!-- container-digest:sha256:[0-9a-f]\{64\} -->' <<< "$body" || true)"
          if [[ -n "$existing_marker" && "$existing_marker" != "$marker" ]]; then
            echo "Release notes contain a different container digest" >&2
            exit 1
          fi
          if [[ "$(jq -r .draft "$release_json")" == false ]]; then
            test "$(jq -r .immutable "$release_json")" = true
            grep -Fq "$marker" <<< "$body" || { echo "Published release lacks verified digest metadata" >&2; exit 1; }
            echo "Verified published $IMAGE@$RELEASE_DIGEST"
          else
            notes="$RUNNER_TEMP/release-notes.md"
            if [[ -z "$existing_marker" ]]; then
              printf "%s\n\n## Container image\n\n- \`%s@%s\`\n- Immutable aliases: \`%s\`, \`sha-%s\`\n\n%s\n" \
                "$body" "$IMAGE" "$RELEASE_DIGEST" "$VERSION" "$RELEASE_SHA" "$marker" > "$notes"
            else
              printf '%s\n' "$body" > "$notes"
            fi
            GH_TOKEN="$RELEASE_POLICY_TOKEN" gh release edit "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" --notes-file "$notes" --draft=false --latest
          fi

          # Re-read the public GitHub state after publication.
          read_release > "$RUNNER_TEMP/release-after-publish.json"
          test "$(jq -r .draft "$RUNNER_TEMP/release-after-publish.json")" = false
          test "$(jq -r .immutable "$RUNNER_TEMP/release-after-publish.json")" = true
          test "$(jq -r '.tag_name // empty' "$RUNNER_TEMP/release-after-publish.json")" = "v$VERSION"
          test "$(jq -r '.target_commitish // empty' "$RUNNER_TEMP/release-after-publish.json")" = "$RELEASE_SHA"
          body="$(jq -r '.body // ""' "$RUNNER_TEMP/release-after-publish.json")"
          test "$(grep -Fxc "<!-- release-commit:$RELEASE_SHA -->" <<< "$body" || true)" = 1
          test "$(grep -Fxc "<!-- release-pr:$RELEASE_PR_NUMBER -->" <<< "$body" || true)" = 1
          test "$(grep -Fxc "$marker" <<< "$body" || true)" = 1
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name // empty')"
          if [[ "$latest_tag" == "v$VERSION" ]]; then
            echo "owns-latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "owns-latest=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is not the current GitHub latest Release; preserving the existing latest image alias"
          fi
          echo "Published and re-read $IMAGE@$RELEASE_DIGEST"

      - name: Latest
        if: ${{ steps.github-release.outputs.owns-latest == 'true' }}
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$RELEASE_DIGEST"
          latest="$(docker buildx imagetools inspect "$IMAGE:latest" | awk '/^Digest:/ { print $2; exit }')"
          test "$latest" = "$RELEASE_DIGEST"

      - name: Readback
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          OWNS_LATEST: ${{ steps.github-release.outputs.owns-latest }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          digest_for() {
            docker buildx imagetools inspect "$1" | awk '/^Digest:/ { print $2; exit }'
          }
          for tag in "$VERSION" "sha-$RELEASE_SHA"; do
            test "$(digest_for "$IMAGE:$tag")" = "$RELEASE_DIGEST"
          done
          if [[ "$OWNS_LATEST" == true ]]; then
            test "$(digest_for "$IMAGE:latest")" = "$RELEASE_DIGEST"
          elif [[ "$OWNS_LATEST" != false ]]; then
            echo "Invalid latest ownership state: $OWNS_LATEST" >&2
            exit 1
          fi
          identity="$VERIFIED_SIGNING_IDENTITY"
          cosign verify "$IMAGE@$RELEASE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" >/dev/null

      - name: Publication proof
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.policy-token.outputs.app-slug }}
          RELEASE_POLICY_TOKEN: ${{ steps.policy-token.outputs.token }}
        run: bash "$RUNNER_TEMP/manage-release.sh" complete-publish
