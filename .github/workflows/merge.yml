name: Merge

on:
  pull_request_review:
    types: [submitted]
  workflow_run: # zizmor: ignore[dangerous-triggers] Trusted main revalidates the same-repository release branch, exact SHA, approval, and CI run before minting a scoped App token.
    workflows: [CI]
    types: [completed]

permissions:
  actions: read # Bind the merge decision to the exact completed CI run.
  contents: read
  pull-requests: read # Revalidate the release PR head, approval, and mergeability.

concurrency:
  group: release-merge
  cancel-in-progress: false

jobs:
  release:
    name: Release PR
    if: >-
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.ref == 'release/next' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'release/next' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Trusted checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          path: trusted
          persist-credentials: false
      - name: Readiness
        id: ready
        env:
          EXPECTED_FOCUSED_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: bash "$GITHUB_WORKSPACE/trusted/scripts/manage-release.sh" merge-ready
      - name: App token
        if: ${{ steps.ready.outputs.ready == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: read
      - name: Candidate checkout
        if: ${{ steps.ready.outputs.ready == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Rust toolchain
        if: ${{ steps.ready.outputs.ready == 'true' }}
        working-directory: trusted
        run: rustup toolchain install --no-self-update
      - name: git-cliff
        if: ${{ steps.ready.outputs.ready == 'true' }}
        working-directory: trusted
        run: bash "$GITHUB_WORKSPACE/trusted/scripts/install-git-cliff.sh"
      - name: Merge
        if: ${{ steps.ready.outputs.ready == 'true' }}
        working-directory: candidate
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          EXPECTED_FOCUSED_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RELEASE_PR_NUMBER: ${{ steps.ready.outputs.pr-number }}
        run: bash "$GITHUB_WORKSPACE/trusted/scripts/manage-release.sh" merge-approved
