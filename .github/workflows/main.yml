name: Main

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: main
  cancel-in-progress: true

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read
      - name: Repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: bash scripts/manage-release.sh validate-policy

  validation:
    name: Validate
    needs: policy
    uses: ./.github/workflows/ci.yml
    secrets:
      CROSS_REPO_READ_APP_PRIVATE_KEY: ${{ secrets.CROSS_REPO_READ_APP_PRIVATE_KEY }}

  release:
    name: Release Manager
    needs: validation
    uses: ./.github/workflows/release-manager.yml
    with:
      validation-run-id: ${{ needs.validation.outputs.validation-run-id }}
      verified-sha: ${{ needs.validation.outputs.validated-sha }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
