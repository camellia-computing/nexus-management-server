name: Main

on:
  push:
    branches: [main]

permissions:
  actions: read # Allow the called CI workflow to bind validation to workflow runs.
  contents: read
  pull-requests: read # Allow the called release workflows to validate release PR state.

concurrency:
  group: main
  cancel-in-progress: true

jobs:
  policy:
    name: Policy
    if: ${{ vars.RELEASE_APP_CLIENT_ID != '' || vars.RELEASE_APP_LOGIN != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-metadata: read
      - name: Repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_LOGIN: ${{ vars.RELEASE_APP_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: bash scripts/manage-release.sh validate-policy

  validation:
    name: Validate
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] actionlint 1.7.12 requires this form; GitHub resolves the reviewed same-commit source.
    secrets:
      CROSS_REPO_READ_APP_PRIVATE_KEY: ${{ secrets.CROSS_REPO_READ_APP_PRIVATE_KEY }}

  release:
    name: Release Manager
    if: >-
      always() &&
      vars.RELEASE_APP_CLIENT_ID != '' &&
      vars.RELEASE_APP_LOGIN != '' &&
      needs.policy.result == 'success' &&
      needs.validation.result == 'success'
    needs: [policy, validation]
    uses: ./.github/workflows/release-manager.yml # zizmor: ignore[self-repository] actionlint 1.7.12 requires this form; GitHub resolves the reviewed same-commit source.
    with:
      validation-run-id: ${{ needs.validation.outputs.validation-run-id }}
      verified-sha: ${{ needs.validation.outputs.validated-sha }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
