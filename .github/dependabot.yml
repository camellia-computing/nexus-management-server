version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    commit-message:
      prefix: "build(deps)"
    groups:
      rust-nonbreaking:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "09:20"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-nonbreaking:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "09:30"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    commit-message:
      prefix: "build(deps)"
    groups:
      build-images-nonbreaking:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: node
      - dependency-name: rust

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "09:40"
      timezone: Asia/Singapore
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    commit-message:
      prefix: "build(deps)"
    groups:
      runtime-images-nonbreaking:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: postgres
