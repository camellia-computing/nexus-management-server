x-common-environment: &common-environment
  CAMELLIA_NEXUS_LICENSE_ENV: production
  CAMELLIA_NEXUS_LOG_FORMAT: ${CAMELLIA_NEXUS_LOG_FORMAT:-json}
  CAMELLIA_NEXUS_LOG_LEVEL: ${CAMELLIA_NEXUS_LOG_LEVEL:-info}
  CAMELLIA_NEXUS_HTTP_LOG_LEVEL: ${CAMELLIA_NEXUS_HTTP_LOG_LEVEL:-info}
  CAMELLIA_NEXUS_HTTP_FAILURE_LOG_LEVEL: ${CAMELLIA_NEXUS_HTTP_FAILURE_LOG_LEVEL:-warn}
  CAMELLIA_NEXUS_DATABASE_MAX_CONNECTIONS: ${CAMELLIA_NEXUS_DATABASE_MAX_CONNECTIONS:-8}
  CAMELLIA_NEXUS_DATABASE_ACQUIRE_TIMEOUT_SECONDS: ${CAMELLIA_NEXUS_DATABASE_ACQUIRE_TIMEOUT_SECONDS:-5}

x-container-hardening: &container-hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-service: &service
  <<: *container-hardening
  image: ${CAMELLIA_NEXUS_LICENSE_IMAGE:?set CAMELLIA_NEXUS_LICENSE_IMAGE to an immutable image digest}
  depends_on:
    migrate:
      condition: service_completed_successfully
  stop_grace_period: 30s
  restart: unless-stopped

services:
  migrate:
    <<: *container-hardening
    image: ${CAMELLIA_NEXUS_LICENSE_IMAGE:?set CAMELLIA_NEXUS_LICENSE_IMAGE to an immutable image digest}
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-environment
      DATABASE_URL: postgres://${CAMELLIA_NEXUS_DATABASE_MIGRATE_ROLE:-nexus_migrate}@postgres:5432/${CAMELLIA_NEXUS_DATABASE_NAME:-nexus}
      DATABASE_PASSWORD_FILE: /run/secrets/database_migrate_password
      CAMELLIA_NEXUS_DATABASE_PUBLIC_ROLE: ${CAMELLIA_NEXUS_DATABASE_PUBLIC_ROLE:-nexus_public}
      CAMELLIA_NEXUS_DATABASE_ADMIN_WEB_ROLE: ${CAMELLIA_NEXUS_DATABASE_ADMIN_WEB_ROLE:-nexus_admin_web}
      CAMELLIA_NEXUS_DATABASE_ADMIN_WORKER_ROLE: ${CAMELLIA_NEXUS_DATABASE_ADMIN_WORKER_ROLE:-nexus_admin_worker}
    secrets:
      - database_migrate_password
    restart: "no"

  management-server:
    <<: *service
    container_name: camellia-nexus-management-server
    command: ["serve"]
    environment:
      <<: *common-environment
      DATABASE_URL: postgres://${CAMELLIA_NEXUS_DATABASE_PUBLIC_ROLE:-nexus_public}@postgres:5432/${CAMELLIA_NEXUS_DATABASE_NAME:-nexus}
      DATABASE_PASSWORD_FILE: /run/secrets/database_public_password
      CAMELLIA_NEXUS_LICENSE_BIND: 0.0.0.0:8088
      CAMELLIA_NEXUS_LICENSE_STORAGE: postgres
      CAMELLIA_NEXUS_LICENSE_ISSUER: ${CAMELLIA_NEXUS_LICENSE_ISSUER:?set the production HTTPS issuer}
      CAMELLIA_NEXUS_LICENSE_AUDIENCE: ${CAMELLIA_NEXUS_LICENSE_AUDIENCE:-camellia-nexus-desktop}
      CAMELLIA_NEXUS_LICENSE_KEY_ID: ${CAMELLIA_NEXUS_LICENSE_KEY_ID:?set the active entitlement key id}
      CAMELLIA_NEXUS_LICENSE_PRIVATE_KEY_PEM_PATH: /run/secrets/entitlement_private_key
      CAMELLIA_NEXUS_WORKSPACE_KEYRING_PATH: /run/secrets/workspace_keyring
      CAMELLIA_NEXUS_WEBHOOK_KEYRING_PATH: /run/secrets/webhook_keyring
      CAMELLIA_NEXUS_OAUTH_CLIENT_ID: ${CAMELLIA_NEXUS_OAUTH_CLIENT_ID:-camellia-nexus-desktop}
      CAMELLIA_NEXUS_OAUTH_REDIRECT_URIS: ${CAMELLIA_NEXUS_OAUTH_REDIRECT_URIS:-camellia-nexus://auth/callback}
      CAMELLIA_NEXUS_CLIENT_MINIMUM_VERSION: ${CAMELLIA_NEXUS_CLIENT_MINIMUM_VERSION:?set the minimum supported client version}
      CAMELLIA_NEXUS_CLIENT_RECOMMENDED_VERSION: ${CAMELLIA_NEXUS_CLIENT_RECOMMENDED_VERSION:?set the recommended client version}
      CAMELLIA_NEXUS_CLIENT_VERSION_ENFORCE_AFTER: "${CAMELLIA_NEXUS_CLIENT_VERSION_ENFORCE_AFTER:?set the absolute client-version enforcement time}"
      CAMELLIA_NEXUS_CORS_ALLOWED_ORIGINS: ${CAMELLIA_NEXUS_CORS_ALLOWED_ORIGINS:-camellia-nexus://localhost}
      CAMELLIA_NEXUS_DATABASE_MIGRATE: false
      CAMELLIA_NEXUS_TIME_MAX_FORWARD_JUMP_SECONDS: ${CAMELLIA_NEXUS_TIME_MAX_FORWARD_JUMP_SECONDS:-86400}
      CAMELLIA_NEXUS_HTTP_REQUEST_TIMEOUT_SECONDS: ${CAMELLIA_NEXUS_HTTP_REQUEST_TIMEOUT_SECONDS:-15}
      CAMELLIA_NEXUS_HTTP_MAX_IN_FLIGHT: ${CAMELLIA_NEXUS_HTTP_MAX_IN_FLIGHT:-256}
      CAMELLIA_NEXUS_MAINTENANCE_INTERVAL_SECONDS: ${CAMELLIA_NEXUS_MAINTENANCE_INTERVAL_SECONDS:-3600}
      CAMELLIA_NEXUS_CLEANUP_BATCH_SIZE: ${CAMELLIA_NEXUS_CLEANUP_BATCH_SIZE:-1000}
      CAMELLIA_NEXUS_METRICS_BIND: 0.0.0.0:9091
      CAMELLIA_NEXUS_METRICS_ALLOW_NON_LOOPBACK: "true"
    ports:
      - "127.0.0.1:${CAMELLIA_NEXUS_LICENSE_HOST_PORT:-8088}:8088"
      - "127.0.0.1:${CAMELLIA_NEXUS_LICENSE_METRICS_HOST_PORT:-9091}:9091"
    secrets:
      - database_public_password
      - entitlement_private_key
      - workspace_keyring
      - webhook_keyring
    healthcheck:
      test: ["CMD", "camellia-nexus-management-server", "healthcheck", "http://127.0.0.1:8088/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  admin-web:
    <<: *service
    command: ["admin-web"]
    stop_grace_period: 210s
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    environment:
      <<: *common-environment
      DATABASE_URL: postgres://${CAMELLIA_NEXUS_DATABASE_ADMIN_WEB_ROLE:-nexus_admin_web}@postgres:5432/${CAMELLIA_NEXUS_DATABASE_NAME:-nexus}
      DATABASE_PASSWORD_FILE: /run/secrets/database_admin_web_password
      CAMELLIA_NEXUS_DATABASE_MIGRATE: false
      CAMELLIA_NEXUS_ADMIN_BIND: 0.0.0.0:8090
      CAMELLIA_NEXUS_ADMIN_PUBLIC_ORIGIN: ${CAMELLIA_NEXUS_ADMIN_PUBLIC_ORIGIN:?set the private Admin HTTPS origin}
      CAMELLIA_NEXUS_ADMIN_REQUEST_TIMEOUT_SECONDS: ${CAMELLIA_NEXUS_ADMIN_REQUEST_TIMEOUT_SECONDS:-180}
      CAMELLIA_NEXUS_ADMIN_MAX_IN_FLIGHT: ${CAMELLIA_NEXUS_ADMIN_MAX_IN_FLIGHT:-64}
      CAMELLIA_NEXUS_ADMIN_KEYRING_PATH: /run/secrets/admin_keyring
      CAMELLIA_NEXUS_ADMIN_FORWARDED_FOR_SECRET_PATH: /run/secrets/admin_proxy_secret
      CAMELLIA_NEXUS_OBJECT_STORAGE: database
      CAMELLIA_NEXUS_OBJECT_HARD_LIMIT_BYTES: ${CAMELLIA_NEXUS_OBJECT_HARD_LIMIT_BYTES:-21474836480}
      CAMELLIA_NEXUS_OBJECT_MAX_BYTES: ${CAMELLIA_NEXUS_OBJECT_MAX_BYTES:-67108864}
      CAMELLIA_NEXUS_EVIDENCE_SCANNER: clamav
      CAMELLIA_NEXUS_CLAMAV_ADDRESS: clamav:3310
      CAMELLIA_NEXUS_METRICS_BIND: 0.0.0.0:9092
      CAMELLIA_NEXUS_METRICS_ALLOW_NON_LOOPBACK: "true"
    ports:
      - "127.0.0.1:${CAMELLIA_NEXUS_ADMIN_HOST_PORT:-8090}:8090"
      - "127.0.0.1:${CAMELLIA_NEXUS_ADMIN_METRICS_HOST_PORT:-9092}:9092"
    secrets:
      - database_admin_web_password
      - admin_keyring
      - admin_proxy_secret
    healthcheck:
      test: ["CMD", "camellia-nexus-management-server", "healthcheck", "http://127.0.0.1:8090/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  admin-worker:
    <<: *service
    command: ["admin-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    environment:
      <<: *common-environment
      DATABASE_URL: postgres://${CAMELLIA_NEXUS_DATABASE_ADMIN_WORKER_ROLE:-nexus_admin_worker}@postgres:5432/${CAMELLIA_NEXUS_DATABASE_NAME:-nexus}
      DATABASE_PASSWORD_FILE: /run/secrets/database_admin_worker_password
      CAMELLIA_NEXUS_DATABASE_MIGRATE: false
      CAMELLIA_NEXUS_ADMIN_KEYRING_PATH: /run/secrets/admin_keyring
      CAMELLIA_NEXUS_OBJECT_STORAGE: database
      CAMELLIA_NEXUS_OBJECT_HARD_LIMIT_BYTES: ${CAMELLIA_NEXUS_OBJECT_HARD_LIMIT_BYTES:-21474836480}
      CAMELLIA_NEXUS_OBJECT_MAX_BYTES: ${CAMELLIA_NEXUS_OBJECT_MAX_BYTES:-67108864}
      CAMELLIA_NEXUS_EVIDENCE_SCANNER: clamav
      CAMELLIA_NEXUS_CLAMAV_ADDRESS: clamav:3310
      CAMELLIA_NEXUS_METRICS_BIND: 0.0.0.0:9093
      CAMELLIA_NEXUS_METRICS_ALLOW_NON_LOOPBACK: "true"
    secrets:
      - database_admin_worker_password
      - admin_keyring
    healthcheck:
      test: ["CMD", "camellia-nexus-management-server", "healthcheck", "http://127.0.0.1:9093/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  clamav:
    image: clamav/clamav:1.4.5_base@sha256:35ec19c1e8cbee7cae8a35c3b0ac62957d99b418e6902035b89a1778c39433e7
    volumes:
      - clamav-data:/var/lib/clamav
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: ${CAMELLIA_NEXUS_DATABASE_NAME:-nexus}
      POSTGRES_USER: ${CAMELLIA_NEXUS_DATABASE_MIGRATE_ROLE:-nexus_migrate}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_migrate_password
      CAMELLIA_NEXUS_DATABASE_PUBLIC_ROLE: ${CAMELLIA_NEXUS_DATABASE_PUBLIC_ROLE:-nexus_public}
      CAMELLIA_NEXUS_DATABASE_PUBLIC_PASSWORD_FILE: /run/secrets/database_public_password
      CAMELLIA_NEXUS_DATABASE_ADMIN_WEB_ROLE: ${CAMELLIA_NEXUS_DATABASE_ADMIN_WEB_ROLE:-nexus_admin_web}
      CAMELLIA_NEXUS_DATABASE_ADMIN_WEB_PASSWORD_FILE: /run/secrets/database_admin_web_password
      CAMELLIA_NEXUS_DATABASE_ADMIN_WORKER_ROLE: ${CAMELLIA_NEXUS_DATABASE_ADMIN_WORKER_ROLE:-nexus_admin_worker}
      CAMELLIA_NEXUS_DATABASE_ADMIN_WORKER_PASSWORD_FILE: /run/secrets/database_admin_worker_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username $$POSTGRES_USER --dbname $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-18-data:/var/lib/postgresql
      - type: bind
        source: ./deploy/postgres/init-runtime-roles.sh
        target: /docker-entrypoint-initdb.d/10-runtime-roles.sh
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - database_migrate_password
      - database_public_password
      - database_admin_web_password
      - database_admin_worker_password
    restart: unless-stopped

secrets:
  database_migrate_password:
    file: ${CAMELLIA_NEXUS_DATABASE_MIGRATE_PASSWORD_FILE:-./secrets/database-migrate-password}
  database_public_password:
    file: ${CAMELLIA_NEXUS_DATABASE_PUBLIC_PASSWORD_FILE:-./secrets/database-public-password}
  database_admin_web_password:
    file: ${CAMELLIA_NEXUS_DATABASE_ADMIN_WEB_PASSWORD_FILE:-./secrets/database-admin-web-password}
  database_admin_worker_password:
    file: ${CAMELLIA_NEXUS_DATABASE_ADMIN_WORKER_PASSWORD_FILE:-./secrets/database-admin-worker-password}
  entitlement_private_key:
    file: ${CAMELLIA_NEXUS_ENTITLEMENT_PRIVATE_KEY_FILE:-./secrets/entitlement-es256-private.pem}
  workspace_keyring:
    file: ${CAMELLIA_NEXUS_WORKSPACE_KEYRING_FILE:-./secrets/workspace-keyring.json}
  webhook_keyring:
    file: ${CAMELLIA_NEXUS_WEBHOOK_KEYRING_FILE:-./secrets/webhook-keyring.json}
  admin_keyring:
    file: ${CAMELLIA_NEXUS_ADMIN_KEYRING_FILE:-./secrets/admin-keyring.json}
  admin_proxy_secret:
    file: ${CAMELLIA_NEXUS_ADMIN_PROXY_SECRET_FILE:-./secrets/admin-proxy-secret}

volumes:
  postgres-18-data:
  clamav-data:
