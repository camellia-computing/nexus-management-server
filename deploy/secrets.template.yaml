# Copy this file only into a protected temporary directory, replace every value,
# encrypt it with SOPS + the production age recipient, then securely remove the
# plaintext copy. Never commit a populated version.
database:
  bootstrap_password: replace-with-32-to-128-url-safe-random-characters
  migrate_password: replace-with-an-independent-random-value
  public_password: replace-with-an-independent-random-value
  admin_web_password: replace-with-an-independent-random-value
  admin_worker_password: replace-with-an-independent-random-value
crypto:
  entitlement_private_pem: |-
    replace-with-the-complete-es256-private-pem
  workspace_keyring_json: |-
    replace-with-the-complete-workspace-keyring-json
  webhook_keyring_json: |-
    replace-with-the-complete-webhook-keyring-json
  admin_keyring_json: |-
    replace-with-the-complete-admin-keyring-json
proxy:
  admin_secret: replace-with-32-to-256-visible-ascii-characters
